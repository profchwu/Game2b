<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#121410">
  <meta name="description" content="小小夢魔：穿越夢境學會生活理財與投資。">
  <title>小小夢魔｜夢境理財所</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700;800&family=Noto+Serif+TC:wght@500;600;700;800&display=swap');
    :root{--ink:#f4eedf;--muted:#bebaa9;--gold:#efc96e;--moss:#9ba77c;--panel:rgba(23,25,19,.82);--line:rgba(245,231,192,.17)}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:#11130f;color:var(--ink);font-family:'Noto Sans TC',sans-serif;min-height:100vh}button{font:inherit;color:inherit;cursor:pointer}button:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
    .scene{min-height:100vh;position:relative;overflow:hidden;background:radial-gradient(ellipse at 53% 48%,rgba(217,179,103,.18),transparent 28%),linear-gradient(90deg,rgba(9,10,9,.9),rgba(12,13,10,.28) 52%,rgba(9,10,9,.84)),linear-gradient(0deg,#11130f 1%,transparent 42%),repeating-linear-gradient(90deg,transparent 0 86px,rgba(237,219,174,.025) 87px 89px),linear-gradient(180deg,#24291e,#484635 43%,#28251d 79%,#151611)}
    .scene:before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 49%,rgba(239,201,110,.18),transparent 5%,transparent 19%,rgba(0,0,0,.6) 83%),repeating-linear-gradient(0deg,transparent 0 72px,rgba(235,224,185,.035) 73px 74px);pointer-events:none}
    .scene:after{content:"";position:absolute;bottom:0;left:0;right:0;height:27%;background:linear-gradient(180deg,transparent,rgba(8,9,8,.46)),repeating-linear-gradient(90deg,rgba(199,177,125,.05) 0 1px,transparent 1px 150px),linear-gradient(180deg,#29271e,#12130f);clip-path:polygon(0 24%,100% 2%,100% 100%,0 100%);pointer-events:none}
    .window{position:absolute;right:14%;top:17%;width:160px;height:252px;border:12px solid #29251b;background:linear-gradient(130deg,rgba(179,190,158,.18),rgba(30,39,32,.45));box-shadow:0 0 24px #d8d4a022,inset 0 0 28px #d8d4a022;transform:rotate(1deg)}.window:before,.window:after{content:"";position:absolute;background:#29251b}.window:before{width:8px;left:50%;top:0;bottom:0}.window:after{height:8px;top:48%;left:0;right:0}
    .wardrobe{position:absolute;bottom:18%;right:5%;width:150px;height:335px;background:linear-gradient(90deg,#34291e,#5b4530 18%,#3b2d20 20%,#57412d 78%,#241d16);border:8px solid #291e16;box-shadow:10px 12px 34px #0009}.wardrobe:before{content:"";position:absolute;inset:8px;border:2px solid #836543;box-shadow:inset 0 0 0 6px #33271d}.wardrobe:after{content:"";position:absolute;right:35px;top:53%;width:7px;height:7px;border-radius:50%;background:#c6a35d;box-shadow:0 49px #c6a35d,-60px -91px #c6a35d,-60px -42px #c6a35d}
    .dresser{position:absolute;left:7%;bottom:17%;width:210px;height:255px;background:linear-gradient(90deg,#403123,#715639 16%,#493625 18%,#604832 85%,#2b2118);border:8px solid #281d15;box-shadow:8px 12px 30px #0008}.dresser:before{content:"";position:absolute;inset:10px 12px;background:repeating-linear-gradient(0deg,transparent 0 49px,#2a2119 50px 55px,transparent 56px 58px);border:2px solid #876b45}.dresser:after{content:"";position:absolute;left:50%;top:25px;bottom:15px;width:5px;background:#32251b}
    .lamp{position:absolute;left:34%;top:27%;width:15px;height:15px;border-radius:50%;background:#fff4bd;box-shadow:0 0 15px 7px #fff2ab,0 0 72px 38px #fff2a22b}.lamp:after{content:"";position:absolute;top:15px;left:7px;width:1px;height:104px;background:#c6b98988}
    .dust{position:absolute;inset:0;background-image:radial-gradient(#f6e2a988 1px,transparent 1px),radial-gradient(#f6e2a955 1px,transparent 1px);background-size:97px 107px,149px 123px;background-position:10px 7px,62px 53px;opacity:.22;pointer-events:none}
    .topbar{position:relative;z-index:2;display:flex;justify-content:space-between;align-items:center;padding:25px clamp(20px,5vw,76px)}.brand{letter-spacing:.18em;font-size:12px;color:#ddd2b3}.brand b{color:var(--gold);font-size:17px;margin-right:10px}.sound{background:#11130fb8;border:1px solid var(--line);padding:9px 13px;border-radius:2px;font-size:12px;color:var(--muted)}
    main{position:relative;z-index:1}.hero{width:min(680px,88vw);margin:clamp(70px,12vh,138px) auto 100px;text-align:center}.eyebrow{font-size:12px;letter-spacing:.3em;color:var(--gold);display:flex;align-items:center;gap:12px;justify-content:center}.eyebrow:before,.eyebrow:after{content:"";height:1px;width:34px;background:#efc96e77}.hero h1{font-family:'Noto Serif TC',serif;font-size:clamp(42px,7vw,78px);line-height:1.13;letter-spacing:.12em;margin:23px 0 13px;text-shadow:0 5px 28px #000}.hero h1 span{display:block;color:#eccd86;font-size:.43em;letter-spacing:.35em;margin-top:14px}.hero p{color:#d4d0c0;line-height:1.9;font-size:15px;max-width:480px;margin:20px auto 31px}.primary{border:1px solid #e6c878;background:linear-gradient(135deg,#dbc078,#b78c47);color:#211d14;padding:14px 33px;letter-spacing:.15em;font-weight:800;box-shadow:0 8px 30px #0006;transition:.2s}.primary:hover{transform:translateY(-2px);filter:brightness(1.1)}.hint{font-size:11px;color:#aaa794;margin-top:16px}
    .hud{width:min(970px,92vw);margin:0 auto 20px;display:flex;justify-content:space-between;align-items:center;padding:13px 17px;background:#11130fbd;border:1px solid var(--line);backdrop-filter:blur(6px)}.hud-title{font-size:13px;letter-spacing:.08em}.hud small{color:var(--muted);font-size:11px}.score{color:var(--gold);font-size:13px}.keys{display:flex;gap:8px}.key{width:26px;height:30px;border:1px solid #77715f66;color:#77715f;display:grid;place-items:center;font-size:13px;transform:rotate(45deg) scale(.8)}.key span{transform:rotate(-45deg)}.key.on{color:var(--gold);border-color:var(--gold);background:#f0ca661c;text-shadow:0 0 12px #ffd86c}
    .game-wrap{display:none;padding:0 0 60px}.game-wrap.active{display:block}.level{width:min(970px,92vw);min-height:405px;margin:auto;position:relative;display:grid;grid-template-columns:1.05fr .95fr;border:1px solid var(--line);background:var(--panel);box-shadow:0 18px 70px #0008;backdrop-filter:blur(8px)}.level-art{position:relative;overflow:hidden;min-height:405px;background:radial-gradient(ellipse at 50% 45%,#e6c36f33,transparent 30%),linear-gradient(160deg,#364033,#25291e 55%,#171813)}.level-art:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 69px,#b9a57617 70px 72px),linear-gradient(0deg,#13140f 0 20%,transparent 60%)}.art-caption{position:absolute;bottom:19px;left:22px;color:#d7d1bd;font-size:11px;letter-spacing:.12em}.coin-pile{position:absolute;bottom:27%;left:50%;width:135px;height:65px;transform:translateX(-50%)}.coin-pile i{position:absolute;bottom:0;width:50px;height:12px;border:3px solid #dbb75e;border-radius:50%;background:#a88038;box-shadow:0 6px #6e5128}.coin-pile i:nth-child(2){left:27px;bottom:11px}.coin-pile i:nth-child(3){left:56px;bottom:21px}.coin-pile i:nth-child(4){left:84px;bottom:9px}.coin-pile i:nth-child(5){left:60px;bottom:0}.jar{position:absolute;bottom:28%;right:23%;width:58px;height:76px;border:2px solid #bdc4a66b;border-radius:8px 8px 17px 17px;background:#c2d6b41c;box-shadow:inset 0 0 17px #dcf2cf22}.jar:before{content:"";position:absolute;top:-9px;left:11px;width:32px;height:8px;background:#a9a27d;border:1px solid #5e604b}.figure{position:absolute;bottom:21%;left:22%;width:39px;height:57px;background:#d6c69a;border-radius:40% 40% 5px 5px;filter:drop-shadow(0 4px 8px #000)}.figure:before{content:"";position:absolute;top:-22px;left:3px;width:34px;height:30px;background:#d6c69a;border-radius:50% 50% 43% 43%}.figure:after{content:"";position:absolute;top:-10px;left:9px;width:5px;height:5px;background:#443c2c;border-radius:50%;box-shadow:13px 0 #443c2c}
    .level-copy{padding:34px clamp(22px,4vw,48px);display:flex;flex-direction:column;justify-content:center}.chapter{font-size:11px;letter-spacing:.2em;color:var(--gold)}.level-copy h2{font-family:'Noto Serif TC',serif;font-size:28px;margin:9px 0 10px}.story{font-size:13px;color:#c7c3b5;line-height:1.85;margin:0 0 18px}.question{font-size:15px;line-height:1.7;color:#f1e7cf;font-weight:700;margin:4px 0 14px}.answers{display:grid;gap:9px}.answer{padding:12px 14px;text-align:left;background:#ffffff08;border:1px solid #d9cfad33;color:#dedacb;font-size:13px;line-height:1.55;transition:.18s}.answer:hover:not(:disabled){border-color:#edc965;background:#edc96512;transform:translateX(3px)}.answer:disabled{cursor:default}.answer.good{border-color:#a8bd7d;background:#a8bd7d19;color:#e9f0d8}.answer.bad{border-color:#d37964;background:#d3796418;color:#f4c2b5}.feedback{min-height:34px;padding-top:10px;color:var(--gold);font-size:12px;line-height:1.55}.next{display:none;align-self:flex-start;margin-top:6px;padding:10px 19px;font-size:12px;letter-spacing:.1em}
    .result{display:none;width:min(700px,92vw);margin:0 auto 60px;text-align:center;padding:42px 28px;background:var(--panel);border:1px solid var(--line);box-shadow:0 15px 65px #0008}.result.active{display:block}.result h2{font:600 34px 'Noto Serif TC',serif;margin:8px 0;color:var(--gold)}.result p{color:#ccc8b9;line-height:1.9}.result-score{font-size:38px;color:var(--gold);margin:18px}.badges{display:flex;justify-content:center;gap:12px;margin:20px}.badge{padding:12px 18px;border:1px solid #eac96d77;color:var(--gold);font-size:12px}.progress{margin:24px auto;width:min(440px,90%);text-align:left;font-size:12px;color:#d8d4c5}.bar{height:8px;background:#ffffff15;margin:7px 0 14px}.bar span{display:block;height:100%;background:linear-gradient(90deg,#8f9b6b,#efc96e);transition:width .5s}.footer{position:relative;z-index:1;text-align:center;padding:20px;color:#918d7e;font-size:10px;letter-spacing:.1em}
    @media(max-width:700px){.hero{margin-top:70px}.window{right:7%;transform:scale(.7);transform-origin:top right}.dresser{left:-80px;transform:scale(.75);transform-origin:bottom left}.wardrobe{right:-40px;transform:scale(.8);transform-origin:bottom right}.level{grid-template-columns:1fr}.level-art{min-height:190px}.level-copy{padding:25px}.hud{gap:10px}.hud-title{font-size:11px}.hud small{display:block}.result{padding:32px 18px}}
  </style>
</head>
<body>
  <div class="scene" id="scene">
    <div class="window"></div><div class="dresser"></div><div class="wardrobe"></div><div class="lamp"></div><div class="dust"></div>
    <header class="topbar"><div class="brand"><b>✦</b>夢境理財所</div><button class="sound" id="soundBtn" aria-label="切換音效">♫ 音效：關</button></header>
    <main>
      <section class="hero" id="intro"><div class="eyebrow">DREAMS &amp; LITTLE COINS</div><h1>小小夢魔<span>夢境理財所</span></h1><p>深夜的古老宅邸裡，藏著兩道理財試煉。<br>收好每一枚夢幣，為明天的自己找到更好的選擇。</p><button class="primary" id="startBtn">進入夢境　→</button><div class="hint">兩個房間 · 兩把鑰匙 · 一次成長</div></section>
      <section class="game-wrap" id="game">
        <div class="hud"><div><div class="hud-title" id="hudTitle">第一關｜夢幣儲藏室</div><small id="hudSub">把零用錢分配好，找到開門的鑰匙</small></div><div class="score">得分　<span id="score">0</span></div><div class="keys" aria-label="已取得的鑰匙"><div class="key" id="key1"><span>⚿</span></div><div class="key" id="key2"><span>⚿</span></div></div></div>
        <article class="level"><div class="level-art"><div class="coin-pile"><i></i><i></i><i></i><i></i><i></i></div><div class="jar"></div><div class="figure"></div><div class="art-caption" id="artCaption">房間一：會呼吸的儲藏室</div></div><div class="level-copy"><div class="chapter" id="chapter">CHAPTER 01　/　零用錢</div><h2 id="levelTitle">會呼吸的儲藏室</h2><p class="story" id="story"></p><div class="question" id="question"></div><div class="answers" id="answers"></div><div class="feedback" id="feedback" aria-live="polite"></div><button class="primary next" id="nextBtn">繼續前進　→</button></div></article>
      </section>
      <section class="result" id="result"><div class="eyebrow">A BRIGHTER TOMORROW</div><h2>夢境的出口，亮起來了</h2><p>你帶著兩把鑰匙走出了宅邸。每一次選擇，都讓未來的自己更有力量。</p><div class="result-score">總分　<span id="totalScore">0</span> / 200</div><div class="badges"><div class="badge">⚿ 儲蓄鑰匙</div><div class="badge">⚿ 成長鑰匙</div></div><div class="progress"><div>理財小進步</div><div class="bar"><span id="progressBar"></span></div><div id="progressText"></div></div><button class="primary" id="restartBtn">再走一次夢境　↺</button></section>
    </main><footer class="footer">一枚一枚存下來，夢想就有了形狀　✦　小小夢魔</footer>
  </div>
  <script>
    const levels=[
      {chapter:'CHAPTER 01　/　零用錢',title:'會呼吸的儲藏室',caption:'房間一：會呼吸的儲藏室',sub:'把零用錢分配好，找到開門的鑰匙',story:'木櫃深處傳來咚、咚的聲音。桌上有 100 元零用錢，門上的鎖問你：怎麼做才能一邊享受現在，一邊為想要的東西存錢？',question:'你最好的第一步是什麼？',answers:['馬上全部花掉，今天開心最重要','先留一部分存起來，剩下的再安排花用','把錢藏在房間裡，完全不告訴大人'],correct:1,good:'答對了！先存一部分，是在照顧未來的自己。儲蓄可以幫你慢慢完成目標，也記得和家人一起保管。',bad:'想想看：如果每次都花光，想要的東西還會有機會買到嗎？理財可以從「先存一點」開始。'},
      {chapter:'CHAPTER 02　/　耐心與風險',title:'霧中種子花園',caption:'房間二：霧中種子花園',sub:'看懂風險，贏得最後的鑰匙',story:'花園裡有一顆會長大的夢想種子。守門人說：投資可能讓錢慢慢成長，但價值也會上下變動，沒有保證。你手上有一筆短期要用的校外教學費。',question:'你會怎麼安排這筆近期要用的錢？',answers:['全部拿去投資，希望短時間賺更多','先安全保留近期要用的錢；投資要和家人討論、用能等待的錢','聽陌生人說一定會賺，就立刻把錢交給他'],correct:1,good:'答對了！投資有風險、可能賠錢，短期要用的錢先保留。投資前要先學習並和可信任的大人討論。',bad:'投資不是保證賺錢，錢可能變少。近期要用的錢應先安全保留，也不要把錢交給陌生人。'}
    ];
    let level=0,score=0,answersLog=[];
    const $=id=>document.getElementById(id);
    function showLevel(){const l=levels[level];$('hudTitle').textContent=`第${level+1}關｜${level?'霧中種子花園':'夢幣儲藏室'}`;$('hudSub').textContent=l.sub;$('chapter').textContent=l.chapter;$('levelTitle').textContent=l.title;$('artCaption').textContent=l.caption;$('story').textContent=l.story;$('question').textContent=l.question;$('feedback').textContent='';$('nextBtn').style.display='none';$('answers').innerHTML='';l.answers.forEach((t,i)=>{const b=document.createElement('button');b.className='answer';b.textContent=t;b.onclick=()=>choose(i,b);$('answers').appendChild(b)})}
    function choose(i,btn){const l=levels[level],all=[...document.querySelectorAll('.answer')];all.forEach(x=>x.disabled=true);answersLog[level]=i===l.correct;if(i===l.correct){score+=100;btn.classList.add('good');$('feedback').textContent=l.good}else{btn.classList.add('bad');all[l.correct].classList.add('good');$('feedback').textContent=l.bad} $('score').textContent=score;$('key'+(level+1)).classList.add('on');$('nextBtn').textContent=level===0?'前往第二個房間　→':'查看我的進步　→';$('nextBtn').style.display='inline-block'}
    $('startBtn').onclick=()=>{$('intro').style.display='none';$('game').classList.add('active');showLevel()};$('nextBtn').onclick=()=>{if(level===0){level=1;showLevel()}else finish()};
    function finish(){$('game').classList.remove('active');$('result').classList.add('active');$('totalScore').textContent=score;$('progressBar').style.width=(score/2)+'%';let correct=answersLog.filter(Boolean).length;$('progressText').textContent=`你答對 ${correct} 題，完成了「先儲蓄」與「認識投資風險」兩項練習。${correct===2?'兩關都一次通過，太棒了！':'每一次重新思考，都是新的進步。再試一次看看能否集齊兩顆星。'}`}
    $('restartBtn').onclick=()=>{level=0;score=0;answersLog=[];$('score').textContent='0';$('key1').classList.remove('on');$('key2').classList.remove('on');$('result').classList.remove('active');$('intro').style.display='block'};
    $('soundBtn').onclick=()=>{const btn=$('soundBtn');const on=btn.dataset.on==='1';btn.dataset.on=on?'0':'1';btn.textContent=on?'♫ 音效：關':'♫ 音效：開'};
  </script>
</body>
</html>
